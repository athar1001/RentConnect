version: '3.8'

services:
  db:
    image: mysql:8
    container_name: apartment_tracker_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: apartment_tracker
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
